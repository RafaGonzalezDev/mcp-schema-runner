name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.x', '24.x']
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - name: Install locked dependencies
        run: npm run install:ci
        timeout-minutes: 5
      - name: Typecheck
        run: npm run typecheck
        timeout-minutes: 2
      - name: Test
        run: npm test
        timeout-minutes: 3
      - name: Build
        run: npm run build
        timeout-minutes: 2
      - name: Smoke built application
        run: npm run smoke
        timeout-minutes: 2
      - name: Smoke development supervisor
        run: npm run smoke:dev
        timeout-minutes: 2
